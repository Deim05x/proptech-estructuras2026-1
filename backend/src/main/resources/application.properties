spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:mariadb://localhost:3306/inmobiliaria_db
spring.datasource.username=root
spring.datasource.password=110426
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.sql.init.mode=always

hogarxpress.ai.enabled=${AI_ENABLED:false}
hogarxpress.ai.provider=${AI_PROVIDER:openai}
hogarxpress.ai.api-url=${AI_API_URL:}
hogarxpress.ai.api-key=${AI_API_KEY:${OPENAI_API_KEY:${GEMINI_API_KEY:}}}
hogarxpress.ai.model=${AI_MODEL:}

hogarxpress.mail.enabled=${MAIL_ENABLED:false}
hogarxpress.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
hogarxpress.mail.from-name=${MAIL_FROM_NAME:HogarXpress}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT:5000}
